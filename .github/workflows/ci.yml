name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-extras --group dev
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --group dev
      - name: pytest
        run: uv run pytest -q --durations=10
      - name: end-to-end example
        run: uv run python examples/workbook_case.py

  build:
    name: build the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: the wheel must carry every source file and py.typed
        run: |
          python - <<'PY'
          import glob, pathlib, zipfile
          names = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          root = pathlib.Path("src")
          want = {
              p.relative_to(root).as_posix()
              for p in root.rglob("*")
              if p.is_file() and "__pycache__" not in p.parts
          }
          assert "carbitrage/py.typed" in want, "py.typed has gone missing from src/"
          missing = sorted(want - names)
          assert not missing, missing
          print(f"wheel contents ok: {len(want)} files")
          PY
