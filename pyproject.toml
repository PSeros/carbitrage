[project]
name = "carbitrage"
version = "0.1.0"
description = "Capital budgeting for mutually exclusive asset alternatives with unequal lives"
readme = "README.md"
authors = [
    { name = "PSeros" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
viz = ["matplotlib>=3.8"]
frames = ["pandas>=2.1"]
jupyter = [
    "jupyter>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PT", "ANN"]
ignore = ["RUF001", "RUF002", "RUF003", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "openpyxl.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
